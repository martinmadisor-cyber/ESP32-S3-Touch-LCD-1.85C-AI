name: PlatformIO CI (ESP32 Firmware)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Run Firmware Tests and Build
      run: |
        chmod +x src/run_tests.sh
        ./src/run_tests.sh
      env:
        WIFI_SSID: "ci_test"
        WIFI_PASSWORD: "ci_test_password"
        WEBSOCKET_URL: "ws://localhost:8765"
        UPLOAD_URL: "http://localhost:8766"
