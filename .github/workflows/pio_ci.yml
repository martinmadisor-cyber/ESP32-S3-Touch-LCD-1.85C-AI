name: PlatformIO CI (ESP32 Firmware)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache PlatformIO Core
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-core-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-core-

    - name: Cache PlatformIO Build
      uses: actions/cache@v4
      with:
        path: .pio
        key: ${{ runner.os }}-pio-build-${{ hashFiles('**/platformio.ini') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-pio-build-${{ hashFiles('**/platformio.ini') }}-
          ${{ runner.os }}-pio-build-

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Fetch remote Arduino libraries
      run: |
        chmod +x import_remote_libs.sh
        ./import_remote_libs.sh

    - name: Run Firmware Tests and Build
      run: |
        chmod +x src/run_tests.sh
        ./src/run_tests.sh
      env:
        WIFI_SSID: "ci_test"
        WIFI_PASSWORD: "ci_test_password"
        WEBSOCKET_URL: "ws://localhost:8765"
        UPLOAD_URL: "http://localhost:8766"
