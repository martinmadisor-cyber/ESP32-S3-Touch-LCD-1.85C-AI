<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32-S3 File Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Menu -->
    <nav>
        <a href="/">Home</a>
        <a href="/internet_radio.html">Internet Radio</a>
        <a class="active" href="/file_explorer.html">File Explorer</a>
        <a href="/alarms.html">Alarms</a>
    </nav>

<h1>📁 ESP32-S3-Touch-LCD-1.85C File Explorer</h1>

<div class="toolbar">
  <button onclick="goUp()">⬆ Go Up</button>
  <button onclick="createFolder()">📁 New Folder</button>
  <input type="file" id="fileInput">
  <button onclick="uploadFile()">⤴ Upload</button>
</div>

<div id="clipboardBanner" style="display: none; background: #fff3cd; color: #856404; padding: 10px 20px; margin: 10px 20px; border-radius: 8px; border: 1px solid #ffeeba; justify-content: space-between; align-items: center;">
  <span id="clipboardText" style="font-weight: bold;"></span>
  <div style="display: flex; gap: 10px;">
    <button onclick="pasteClipboard()" class="primary">📋 Paste Here</button>
    <button onclick="clearClipboard()">❌ Cancel</button>
  </div>
</div>

<div class="path-display" id="currentPathDisplay">/</div>

<div class="entry header">
  <div>Name</div><div>Size</div><div>Actions</div>
</div>
<div id="fileList"></div>

<script>
let currentPath = decodeURIComponent(new URLSearchParams(window.location.search).get('path') || '/');
window.clipboard = null;

function updateClipboardBanner() {
  const banner = document.getElementById('clipboardBanner');
  if (window.clipboard) {
    document.getElementById('clipboardText').innerText = '✂️ Ready to move: ' + window.clipboard.name;
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

function clearClipboard() {
  window.clipboard = null;
  updateClipboardBanner();
}

function pasteClipboard() {
  if (!window.clipboard) return;
  const from = window.clipboard.path;
  const to = currentPath.replace(/\/$/, '') + '/' + window.clipboard.name;
  
  if (from === to) {
    alert("Source and destination are the same!");
    clearClipboard();
    return;
  }
  
  fetch("/move", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`
  }).then(resp => {
    if (resp.ok) {
      clearClipboard();
      loadFiles();
    } else {
      alert("Move failed!");
    }
  });
}

function updatePathInURL() {
  const url = new URL(window.location.href);
  url.searchParams.set('path', currentPath);
  window.history.replaceState({}, '', url);
}

function formatBytes(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const units = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + units[i];
}

function goUp() {
  const parts = currentPath.split('/').filter(Boolean);
  parts.pop();
  currentPath = '/' + parts.join('/');
  updatePathInURL();
  loadFiles();
}

async function loadFiles() {
  updatePathInURL();
  document.getElementById('currentPathDisplay').innerText = currentPath;

  const res = await fetch(`/listfiles?type=json&path=${encodeURIComponent(currentPath)}`);
  const items = await res.json();

  const container = document.getElementById('fileList');
  container.innerHTML = '';

  // Sort items: directories first, then files, both alphabetically
  items.sort((a, b) => {
    if (a.isDir && !b.isDir) return -1;
    if (!a.isDir && b.isDir) return 1;
    return a.name.localeCompare(b.name);
  });

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'entry';

    // Create name
    const nameCell = document.createElement('div');
    nameCell.className = 'name';
    nameCell.innerText = item.name;
    if (item.isDir) {
      nameCell.style.fontWeight = 'bold';
      nameCell.style.cursor = 'pointer';
      nameCell.onclick = () => {
        currentPath = currentPath.replace(/\/$/, '') + '/' + item.name;
        loadFiles();
      };
    }

    // Create size
    const sizeCell = document.createElement('div');
    sizeCell.className = 'size';
    sizeCell.innerText = item.isDir ? '-' : formatBytes(item.size);

    const actionCell = document.createElement('div');
    actionCell.className = 'table-actions';

    // Create rename button
    const renameBtn = document.createElement('button');
    renameBtn.innerText = '✏ Rename';
    renameBtn.onclick = () => {
      const oldPath = currentPath.replace(/\/$/, '') + '/' + item.name;
      const newName = prompt("New name:", item.name);
      if (!newName || newName === item.name) return;
      const newPath = currentPath.replace(/\/$/, '') + '/' + newName;
      fetch("/rename", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `from=${encodeURIComponent(oldPath)}&to=${encodeURIComponent(newPath)}`
      }).then(() => loadFiles());
    };
    actionCell.appendChild(renameBtn);

    // Create cut button
    const cutBtn = document.createElement('button');
    cutBtn.innerText = '✂️ Cut';
    cutBtn.onclick = () => {
      window.clipboard = {
        path: currentPath.replace(/\/$/, '') + '/' + item.name,
        name: item.name
      };
      updateClipboardBanner();
    };
    actionCell.appendChild(cutBtn);

    if (!item.isDir) {
      // Create download button
      const downloadBtn = document.createElement('button');
      downloadBtn.innerText = '⬇ Download';
      downloadBtn.onclick = () => {
        const fullPath = currentPath.replace(/\/$/, '') + '/' + item.name;
        const a = document.createElement('a');
        a.href = `/download?path=${encodeURIComponent(fullPath)}`;
        a.download = item.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      actionCell.appendChild(downloadBtn);

      // Create preview button
      const previewBtn = document.createElement('button');
      previewBtn.innerText = '🔍 Preview';
      previewBtn.onclick = () => {
        const fullPath = currentPath.replace(/\/$/, '') + '/' + item.name;
        window.open(`/preview?path=${encodeURIComponent(fullPath)}`, '_blank');
      };
      actionCell.appendChild(previewBtn);
    }

    // Create delete button
    const delBtn = document.createElement('button');
    delBtn.className = 'danger';
    delBtn.innerText = '🗑 Delete';
    delBtn.onclick = () => {
      const path = currentPath.replace(/\/$/, '') + '/' + item.name;
      if (confirm(`Are you sure you want to delete "${item.name}"?`)) {
        fetch("/delete", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `path=${encodeURIComponent(path)}`
        }).then(() => loadFiles());
      }
    };
    actionCell.appendChild(delBtn);

    row.appendChild(nameCell);
    row.appendChild(sizeCell);
    row.appendChild(actionCell);

    container.appendChild(row);
  });
}

function uploadFile(file = null) {
  const fileInput = document.getElementById('fileInput');
  const fileToUpload = file || (fileInput.files.length ? fileInput.files[0] : null);
  if (!fileToUpload) return alert("Select a file first.");

  const formData = new FormData();
  formData.append('file', fileToUpload);
  // ESP32 WebServer's upload handler needs the 'path' as a URL parameter to parse it properly during UPLOAD_FILE_START
  
  fetch('/upload?path=' + encodeURIComponent(currentPath), { method: 'POST', body: formData })
    .then(resp => resp.text())
    .then(alert)
    .then(() => {
        // Clear input after upload
        fileInput.value = ""; 
        loadFiles();
    });
}

function createFolder() {
  const name = prompt("New folder name:");
  if (!name) return;

  const fullPath = currentPath.replace(/\/$/, '') + '/' + name;
  fetch("/mkdir", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `path=${encodeURIComponent(fullPath)}`
  })
    .then(resp => resp.text())
    .then(alert)
    .then(loadFiles);
}

window.addEventListener('DOMContentLoaded', () => {
  loadFiles();
  
  // Drag and Drop functionality
  const dropZone = document.getElementById('fileList');
  
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.style.border = '2px dashed #007bff';
    dropZone.style.backgroundColor = '#eef5ff';
  });

  dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropZone.style.border = '';
    dropZone.style.backgroundColor = '';
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.border = '';
    dropZone.style.backgroundColor = '';
    if (e.dataTransfer.files.length > 0) {
      uploadFile(e.dataTransfer.files[0]);
    }
  });
});
</script>
</body>
</html>
